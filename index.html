<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Repository Mode Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    main {
      text-align: center;
      padding: 2rem;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      font-size: 1.5rem;
      color: #333;
    }
    p {
      color: #666;
      margin: 0.5rem 0;
    }
    #date-display {
      font-size: 1.2rem;
      color: #555;
      margin-bottom: 1.5rem;
    }
    .like-btn {
      background: #4f46e5;
      color: #fff;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 1rem;
    }
    .like-btn:hover {
      background: #4338ca;
    }
    #like-count {
      font-size: 1.4rem;
      font-weight: bold;
      color: #4f46e5;
      margin-top: 0.75rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Repository Mode Test</h1>
    <p>A test page for remote coding and Git deployment checks.</p>
    <p id="repository-check">GitHub Repository Mode is ready.</p>
    <p id="deployment-check">Vercel Git preview is ready.</p>

    <p id="date-display"></p>

    <button class="like-btn" id="like-btn">👍 좋아요</button>
    <p id="like-count">0</p>
  </main>

  <script>
    // 오늘 날짜 표시
    const dateDisplay = document.getElementById('date-display');
    const today = new Date();
    const options = { year: 'numeric', month: 'long', day: 'numeric' };
    dateDisplay.textContent = today.toLocaleDateString('ko-KR', options);

    // 좋아요 버튼
    let likeCount = 0;
    const likeBtn = document.getElementById('like-btn');
    const likeCountEl = document.getElementById('like-count');

    likeBtn.addEventListener('click', () => {
      likeCount += 1;
      likeCountEl.textContent = likeCount;
    });
  </script>
</body>
</html>
